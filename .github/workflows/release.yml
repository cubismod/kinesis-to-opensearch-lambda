name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Build deployment package
        run: |
          uv pip install --target package -r requirements.txt
          cd package && zip -r ../kinesis-to-opensearch.zip .
          cd .. && zip -g kinesis-to-opensearch.zip lambda_function.py

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" kinesis-to-opensearch.zip --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}"
